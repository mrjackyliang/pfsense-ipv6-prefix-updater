name: "Publish (project)"

run-name: "Publishing ${{ github.event.release.tag_name || 'manually' }} (project)${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && ' (dry run)' || '' }}"

on:
  release:
    types:
      - "published"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without making changes"
        required: false
        type: "boolean"
        default: true
      tag:
        description: "Existing GitHub release tag that receives the package"
        required: true
        type: "string"
        default: ""

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

env:
  PUBLISH: "${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run) }}"
  ROOT_DIR: "./"

jobs:
  build:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
      summary_work_1: "${{ steps.nova-summary.outputs.summary_work_1 }}"
      summary_workspace_1: "${{ steps.nova-summary.outputs.summary_workspace_1 }}"
      summary_destination_1: "${{ steps.nova-summary.outputs.summary_destination_1 }}"
      summary_detail_1: "${{ steps.nova-summary.outputs.summary_detail_1 }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: "actions/setup-node@v7"
        timeout-minutes: 10
        with:
          node-version-file: "${{ env.ROOT_DIR }}/package.json"
          package-manager-cache: false

      - name: "Install packages"
        timeout-minutes: 20
        run: "npm install"
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Check project"
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          npm run check -- --workspace pfsense-ipv6-prefix-updater-docs --workspace pfsense-pkg-ipv6-prefix-updater --exclude-workspace ./
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Build project"
        timeout-minutes: 30
        run: |
          npm run build -- --workspace pfsense-ipv6-prefix-updater-docs --workspace pfsense-pkg-ipv6-prefix-updater --artifact documentation
        working-directory: "${{ env.ROOT_DIR }}"

      - name: "Validate build artifacts"
        timeout-minutes: 30
        run: |
          set -euo pipefail

          ALLOWED_ROOT="${{ github.workspace }}"
          ALLOWED_ROOT="$(realpath "$ALLOWED_ROOT")"
          cd "$ALLOWED_ROOT"

          validate_artifact_root() {
            local artifact_root="$1"
            local candidate
            local candidate_parent
            local first_file
            local relative_candidate
            local resolved_candidate
            local resolved_root

            if [ ! -e "$artifact_root" ] && [ ! -L "$artifact_root" ]; then
              echo "Artifact root does not exist: $artifact_root" >&2
              exit 1
            fi

            if ! resolved_root="$(realpath "$artifact_root")"; then
              echo "Artifact root cannot be resolved: $artifact_root" >&2
              exit 1
            fi

            case "$resolved_root" in
              "$ALLOWED_ROOT"|"$ALLOWED_ROOT"/*) ;;
              *)
                echo "Artifact root escapes its allowed boundary: $artifact_root -> $resolved_root" >&2
                exit 1
                ;;
            esac

            while IFS= read -r -d '' candidate; do
              if ! resolved_candidate="$(realpath "$candidate")"; then
                echo "Artifact contains a broken symlink: $candidate" >&2
                exit 1
              fi

              case "$resolved_candidate" in
                "$resolved_root"|"$resolved_root"/*) ;;
                *)
                  echo "Artifact symlink escapes its root: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac

              candidate_parent="$(realpath "$(dirname "$candidate")")"

              case "$candidate_parent/" in
                "$resolved_candidate"/*)
                  echo "Artifact contains a recursive symlink: $candidate -> $resolved_candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -type l -print0)

            while IFS= read -r -d '' candidate; do
              if [ "$candidate" = "$artifact_root" ]; then
                relative_candidate="$(basename "$candidate")"
              else
                relative_candidate="${candidate#"$artifact_root"/}"
              fi

              case "/$relative_candidate" in
                */.env|*/.env.*|*/.npmrc|*/.netrc|*/.ssh|*/.ssh/*|*/.aws|*/.aws/*|*/.git|*/.git/*)
                  echo "Artifact contains a sensitive hidden path: $candidate" >&2
                  exit 1
                  ;;
              esac
            done < <(find -H "$artifact_root" -print0)

            if [ -d "$artifact_root" ]; then
              if ! first_file="$(find -L "$artifact_root" -type f -print -quit)"; then
                echo "Artifact root could not be traversed safely: $artifact_root" >&2
                exit 1
              fi
            else
              first_file="$resolved_root"
            fi

            if [ -z "$first_file" ]; then
              echo "Artifact root contains no files: $artifact_root" >&2
              exit 1
            fi
          }

          validate_artifact_root "build/documentation"

      - name: "Upload assembled artifact (documentation)"
        uses: "actions/upload-artifact@v7"
        timeout-minutes: 30
        with:
          name: "artifact-documentation"
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: "error"
          path: |
            build/documentation

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Check project"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "pfsense-ipv6-prefix-updater-docs, pfsense-pkg-ipv6-prefix-updater"
          NOVA_SUMMARY_ROW_0_DESTINATION: "Nova checks"
          NOVA_SUMMARY_ROW_0_DETAIL: ""
          NOVA_SUMMARY_ROW_1_WORK: "Build project"
          NOVA_SUMMARY_ROW_1_WORKSPACE: "pfsense-ipv6-prefix-updater-docs, pfsense-pkg-ipv6-prefix-updater"
          NOVA_SUMMARY_ROW_1_DESTINATION: "Build artifacts"
          NOVA_SUMMARY_ROW_1_DETAIL: ""
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
            printf "summary_work_1=%s\\n" "$NOVA_SUMMARY_ROW_1_WORK"
            printf "summary_workspace_1=%s\\n" "$NOVA_SUMMARY_ROW_1_WORKSPACE"
            printf "summary_destination_1=%s\\n" "$NOVA_SUMMARY_ROW_1_DESTINATION"
            printf "summary_detail_1=%s\\n" "$NOVA_SUMMARY_ROW_1_DETAIL"
          } >> "$GITHUB_OUTPUT"

  publish-github-pages-apps-docs:
    needs: "build"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5

      - name: "Download build artifacts"
        uses: "actions/download-artifact@v8"
        timeout-minutes: 30
        with:
          name: "artifact-documentation"
          path: "build/documentation"

      - name: "Check GitHub Pages status"
        timeout-minutes: 30
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "[Pages] GitHub Pages is enabled."
            echo "PAGES_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "[Pages] GitHub Pages is not enabled. Skipping deployment."
            echo "PAGES_ENABLED=false" >> "$GITHUB_ENV"
          fi
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Setup GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/configure-pages@v6"
        timeout-minutes: 10

      - name: "Upload artifact to GitHub Pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/upload-pages-artifact@v5"
        timeout-minutes: 30
        with:
          path: "build/documentation"

      - name: "Deploy to GitHub Pages"
        id: "deploy-pages"
        if: "${{ env.PUBLISH == 'true' && env.PAGES_ENABLED == 'true' }}"
        uses: "actions/deploy-pages@v5"
        timeout-minutes: 30

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Deploy site"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "pfsense-ipv6-prefix-updater-docs"
          NOVA_SUMMARY_ROW_0_DESTINATION: "GitHub Pages"
          NOVA_SUMMARY_ROW_0_DETAIL: "${{ steps.deploy-pages.outputs.page_url || '' }}"
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

  publish-pfsense-packages-ipv6-prefix-updater:
    needs: "build"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "write"
    outputs:
      summary_work_0: "${{ steps.nova-summary.outputs.summary_work_0 }}"
      summary_workspace_0: "${{ steps.nova-summary.outputs.summary_workspace_0 }}"
      summary_destination_0: "${{ steps.nova-summary.outputs.summary_destination_0 }}"
      summary_detail_0: "${{ steps.nova-summary.outputs.summary_detail_0 }}"
    steps:
      - name: "Check for Nova placeholders"
        timeout-minutes: 10
        env:
          PFSENSE_FREEBSD_VERSION: "${{ vars.PFSENSE_FREEBSD_VERSION }}"
          PFSENSE_RELEASE_SIGNING_KEY: "${{ secrets.PFSENSE_RELEASE_SIGNING_KEY }}"
        run: |
          set -euo pipefail

          NOVA_PLACEHOLDER_FOUND="false"

          check_nova_placeholder() {
            if [[ "$2" == "NOVA_PLACEHOLDER" ]]; then
              printf '::error::%s still holds the Nova placeholder; set its real value in the repository settings.\n' "$1"
              NOVA_PLACEHOLDER_FOUND="true"
            fi
          }

          check_nova_placeholder "PFSENSE_FREEBSD_VERSION" "$PFSENSE_FREEBSD_VERSION"
          check_nova_placeholder "PFSENSE_RELEASE_SIGNING_KEY" "$PFSENSE_RELEASE_SIGNING_KEY"

          if [[ "$NOVA_PLACEHOLDER_FOUND" == "true" ]]; then
            exit 1
          fi

      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        timeout-minutes: 5

      - name: "Validate and stage port"
        timeout-minutes: 30
        run: |
          node "./packages/ipv6-prefix-updater/scripts/check-package.mjs"
          node "./packages/ipv6-prefix-updater/scripts/stage-package.mjs"

      - name: "Add release signing key"
        timeout-minutes: 10
        env:
          RELEASE_SIGNING_KEY: "${{ secrets.PFSENSE_RELEASE_SIGNING_KEY }}"
        run: |
          set -eu

          staged_share_directory="./packages/ipv6-prefix-updater/build/port/files/usr/local/share"

          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::notice::The release signing secret is not set, so the package ships without a release signing key."
            exit 0
          fi

          umask 077
          key_directory="$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-signing.XXXXXX")"
          trap 'rm -rf "$key_directory"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" | tr -d '\r' > "${key_directory}/signing-key"

          if ! ssh-keygen -y -P '' -f "${key_directory}/signing-key" > "${key_directory}/signing-key.pub" 2> /dev/null; then
            echo "::error::The release signing secret must be an unencrypted OpenSSH private key that starts with \"-----BEGIN OPENSSH PRIVATE KEY-----\"."
            exit 1
          fi

          public_key="$(awk '{ print $1 " " $2 }' "${key_directory}/signing-key.pub")"

          case "$public_key" in
            "ssh-ed25519 "*)
              ;;
            *)
              echo "::error::The release signing secret must be an Ed25519 key."
              exit 1
              ;;
          esac

          key_file_count=0

          for public_key_file in "${staged_share_directory}"/*/release-signing.pub; do
            if [ ! -f "$public_key_file" ]; then
              continue
            fi

            key_file_count=$((key_file_count + 1))

            if [ -s "$public_key_file" ] && [ -n "$(tail -c 1 "$public_key_file")" ]; then
              printf '\n' >> "$public_key_file"
            fi

            if ! tr -d '\r' < "$public_key_file" | awk '{ print $1 " " $2 }' | grep -Fxq "$public_key"; then
              printf '%s added by the publish workflow\n' "$public_key" >> "$public_key_file"
            fi
          done

          if [ "$key_file_count" -eq 0 ]; then
            echo "::warning::The staged port has no usr/local/share/<package>/release-signing.pub file, so installed copies won't check release signatures."
          fi


      - name: "Build on FreeBSD"
        uses: "vmactions/freebsd-vm@v1"
        timeout-minutes: 30
        with:
          release: "${{ vars.PFSENSE_FREEBSD_VERSION || '15' }}"
          copyback: true
          prepare: |
            pkg install -y ca_root_nss git
          run: |
            git clone --depth 1 --single-branch --branch devel --filter=blob:none --sparse https://github.com/pfsense/FreeBSD-ports.git /usr/ports
            git -C /usr/ports sparse-checkout set Mk Templates Keywords
            PFSENSE_PORTS_DIR=/usr/ports sh "./packages/ipv6-prefix-updater/scripts/build-package.sh"

      - name: "Sign release packages"
        timeout-minutes: 10
        env:
          RELEASE_SIGNING_KEY: "${{ secrets.PFSENSE_RELEASE_SIGNING_KEY }}"
        run: |
          set -eu

          release_directory="./packages/ipv6-prefix-updater/build/release"
          share_directory="./packages/ipv6-prefix-updater/build/port/files/usr/local/share"

          # Prints the key lines of a release-signing.pub file. Blank lines and "#"
          # comments are skipped, the same way the installed package reads the file.
          read_key_lines() {
            tr -d '\r' < "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v -e '^$' -e '^#' || true
          }

          package_count=0

          for package_file in "${release_directory}"/*.pkg; do
            if [ -f "$package_file" ]; then
              package_count=$((package_count + 1))
            fi
          done

          if [ "$package_count" -eq 0 ]; then
            echo "::error::No .pkg files were found in ${release_directory}."
            exit 1
          fi

          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            echo "::notice::The release signing secret is not set, so the release packages are not signed."
            exit 0
          fi

          umask 077
          key_directory="$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-signing.XXXXXX")"
          trap 'rm -rf "$key_directory"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" | tr -d '\r' > "${key_directory}/signing-key"

          if ! ssh-keygen -y -P '' -f "${key_directory}/signing-key" > "${key_directory}/signing-key.pub" 2> /dev/null; then
            echo "::error::The release signing secret must be an unencrypted OpenSSH private key that starts with \"-----BEGIN OPENSSH PRIVATE KEY-----\"."
            exit 1
          fi

          for package_file in "${release_directory}"/*.pkg; do
            package_name="$(basename "$package_file" .pkg)"

            # Versioned files end in -<version>; a stable copy such as pfSense-pkg-Demo.pkg
            # already is the package name, so only a suffix that starts with a digit is removed.
            case "${package_name##*-}" in
              [0-9]*) package_name="${package_name%-*}" ;;
            esac

            public_key_file="${share_directory}/${package_name}/release-signing.pub"

            rm -f "${package_file}.sig"
            ssh-keygen -Y sign -f "${key_directory}/signing-key" -n "$package_name" "$package_file"

            key_lines=""

            if [ -f "$public_key_file" ]; then
              key_lines="$(read_key_lines "$public_key_file")"
            fi

            if [ -z "$key_lines" ]; then
              echo "::warning::${package_name} lists no key in release-signing.pub, so installed copies won't check this signature."
              continue
            fi

            : > "${key_directory}/allowed_signers"

            while IFS= read -r key_line; do
              if ! printf '%s\n' "$key_line" | grep -Eq '^ssh-ed25519[[:space:]]+AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]{43}([[:space:]].*)?$'; then
                echo "::error::${public_key_file} has a line that isn't an \"ssh-ed25519\" public key."
                exit 1
              fi

              key_data="$(printf '%s\n' "$key_line" | awk '{ print $2 }')"
              printf '%s namespaces="%s" ssh-ed25519 %s\n' "$package_name" "$package_name" "$key_data" >> "${key_directory}/allowed_signers"
            done <<KEY_LINES
          ${key_lines}
          KEY_LINES

            if ! ssh-keygen -Y verify -f "${key_directory}/allowed_signers" -I "$package_name" -n "$package_name" -s "${package_file}.sig" < "$package_file"; then
              echo "::error::The release signing secret doesn't match a key in ${public_key_file}."
              exit 1
            fi
          done


      - name: "Upload workflow artifact"
        uses: "actions/upload-artifact@v7"
        timeout-minutes: 30
        with:
          name: "pfsense-ipv6-prefix-updater"
          path: "./packages/ipv6-prefix-updater/build/release/*"
          if-no-files-found: "error"
          retention-days: 7
          include-hidden-files: true

      - name: "Upload GitHub release assets"
        if: "${{ env.PUBLISH == 'true' }}"
        timeout-minutes: 30
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ github.event.release.tag_name || inputs.tag }}"
        run: |
          gh release upload "$RELEASE_TAG" "./packages/ipv6-prefix-updater/build/release/"* --clobber

      - name: "Expose Nova summary rows"
        id: "nova-summary"
        if: "${{ always() }}"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_ROW_0_WORK: "Publish pfSense package"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "pfsense-pkg-ipv6-prefix-updater"
          NOVA_SUMMARY_ROW_0_DESTINATION: "GitHub release assets"
          NOVA_SUMMARY_ROW_0_DETAIL: "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
        run: |
          {
            printf "summary_work_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORK"
            printf "summary_workspace_0=%s\\n" "$NOVA_SUMMARY_ROW_0_WORKSPACE"
            printf "summary_destination_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DESTINATION"
            printf "summary_detail_0=%s\\n" "$NOVA_SUMMARY_ROW_0_DETAIL"
          } >> "$GITHUB_OUTPUT"

  summary:
    needs: ["build", "publish-github-pages-apps-docs", "publish-pfsense-packages-ipv6-prefix-updater"]
    runs-on: "ubuntu-24.04"
    timeout-minutes: 5
    permissions:
      contents: "read"
    if: "${{ always() }}"
    steps:
      - name: "Write Nova workflow summary"
        timeout-minutes: 5
        env:
          NOVA_SUMMARY_PROJECT: "${{ github.repository }}"
          NOVA_SUMMARY_PUBLISH: "${{ env.PUBLISH || 'false' }}"
          NOVA_SUMMARY_VERSION: "${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch || github.ref || github.sha }}"
          NOVA_SUMMARY_ROW_0_WORK: "Check project"
          NOVA_SUMMARY_ROW_0_WORK_OUTPUT: "${{ needs['build'].outputs.summary_work_0 || '' }}"
          NOVA_SUMMARY_ROW_0_WORKSPACE: "pfsense-ipv6-prefix-updater-docs, pfsense-pkg-ipv6-prefix-updater"
          NOVA_SUMMARY_ROW_0_WORKSPACE_OUTPUT: "${{ needs['build'].outputs.summary_workspace_0 || '' }}"
          NOVA_SUMMARY_ROW_0_DESTINATION: "Nova checks"
          NOVA_SUMMARY_ROW_0_DESTINATION_OUTPUT: "${{ needs['build'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_0_DETAIL_OUTPUT: "${{ needs['build'].outputs.summary_detail_0 || '' }}"
          NOVA_SUMMARY_ROW_0_RESULT: "${{ needs['build'].result }}"
          NOVA_SUMMARY_ROW_0_PUBLISH: "false"
          NOVA_SUMMARY_ROW_1_WORK: "Build project"
          NOVA_SUMMARY_ROW_1_WORK_OUTPUT: "${{ needs['build'].outputs.summary_work_1 || '' }}"
          NOVA_SUMMARY_ROW_1_WORKSPACE: "pfsense-ipv6-prefix-updater-docs, pfsense-pkg-ipv6-prefix-updater"
          NOVA_SUMMARY_ROW_1_WORKSPACE_OUTPUT: "${{ needs['build'].outputs.summary_workspace_1 || '' }}"
          NOVA_SUMMARY_ROW_1_DESTINATION: "Build artifacts"
          NOVA_SUMMARY_ROW_1_DESTINATION_OUTPUT: "${{ needs['build'].outputs.summary_destination_1 || '' }}"
          NOVA_SUMMARY_ROW_1_DETAIL_OUTPUT: "${{ needs['build'].outputs.summary_detail_1 || '' }}"
          NOVA_SUMMARY_ROW_1_RESULT: "${{ needs['build'].result }}"
          NOVA_SUMMARY_ROW_1_PUBLISH: "false"
          NOVA_SUMMARY_ROW_2_WORK: "Deploy site"
          NOVA_SUMMARY_ROW_2_WORK_OUTPUT: "${{ needs['publish-github-pages-apps-docs'].outputs.summary_work_0 || '' }}"
          NOVA_SUMMARY_ROW_2_WORKSPACE: "pfsense-ipv6-prefix-updater-docs"
          NOVA_SUMMARY_ROW_2_WORKSPACE_OUTPUT: "${{ needs['publish-github-pages-apps-docs'].outputs.summary_workspace_0 || '' }}"
          NOVA_SUMMARY_ROW_2_DESTINATION: "GitHub Pages"
          NOVA_SUMMARY_ROW_2_DESTINATION_OUTPUT: "${{ needs['publish-github-pages-apps-docs'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_2_DETAIL_OUTPUT: "${{ needs['publish-github-pages-apps-docs'].outputs.summary_detail_0 || '' }}"
          NOVA_SUMMARY_ROW_2_RESULT: "${{ needs['publish-github-pages-apps-docs'].result }}"
          NOVA_SUMMARY_ROW_2_PUBLISH: "true"
          NOVA_SUMMARY_ROW_3_WORK: "Publish pfSense package"
          NOVA_SUMMARY_ROW_3_WORK_OUTPUT: "${{ needs['publish-pfsense-packages-ipv6-prefix-updater'].outputs.summary_work_0 || '' }}"
          NOVA_SUMMARY_ROW_3_WORKSPACE: "pfsense-pkg-ipv6-prefix-updater"
          NOVA_SUMMARY_ROW_3_WORKSPACE_OUTPUT: "${{ needs['publish-pfsense-packages-ipv6-prefix-updater'].outputs.summary_workspace_0 || '' }}"
          NOVA_SUMMARY_ROW_3_DESTINATION: "GitHub release assets"
          NOVA_SUMMARY_ROW_3_DESTINATION_OUTPUT: "${{ needs['publish-pfsense-packages-ipv6-prefix-updater'].outputs.summary_destination_0 || '' }}"
          NOVA_SUMMARY_ROW_3_DETAIL_OUTPUT: "${{ needs['publish-pfsense-packages-ipv6-prefix-updater'].outputs.summary_detail_0 || '' }}"
          NOVA_SUMMARY_ROW_3_RESULT: "${{ needs['publish-pfsense-packages-ipv6-prefix-updater'].result }}"
          NOVA_SUMMARY_ROW_3_PUBLISH: "true"
        run: |
          set -euo pipefail

          sanitize_summary_value() {
            local value="$1"

            value="${value//$'\r'/ }"
            value="${value//$'\n'/ }"
            value="${value//|/\\|}"

            printf '%s' "$value"
          }

          NOVA_SUMMARY_DISPLAY_VERSION="${NOVA_SUMMARY_VERSION#refs/tags/}"
          NOVA_SUMMARY_DISPLAY_VERSION="${NOVA_SUMMARY_DISPLAY_VERSION#refs/heads/}"

          {
            printf "## Nova · %s · %s\\n" "$NOVA_SUMMARY_PROJECT" "$NOVA_SUMMARY_DISPLAY_VERSION"
            printf "\\n"
            printf "| Work | Workspace | Destination | Result |\\n"
            printf "| --- | --- | --- | --- |\\n"

            NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_0_WORK_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORK" ]]; then
              NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_0_WORK"
            fi

            NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_0_WORKSPACE_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORKSPACE" ]]; then
              NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_0_WORKSPACE"
            fi

            NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_0_DESTINATION_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_DESTINATION" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_0_DESTINATION"
            fi

            NOVA_SUMMARY_DETAIL="$NOVA_SUMMARY_ROW_0_DETAIL_OUTPUT"
            if [[ -n "$NOVA_SUMMARY_DETAIL" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_DESTINATION · $NOVA_SUMMARY_DETAIL"
            fi

            NOVA_SUMMARY_RESULT="$NOVA_SUMMARY_ROW_0_RESULT"
            if [[ "$NOVA_SUMMARY_ROW_0_PUBLISH" == "true" && "$NOVA_SUMMARY_PUBLISH" != "true" ]]; then
              NOVA_SUMMARY_RESULT="dry run ($NOVA_SUMMARY_RESULT)"
            fi

            NOVA_SUMMARY_WORK="$(sanitize_summary_value "$NOVA_SUMMARY_WORK")"
            NOVA_SUMMARY_WORKSPACE="$(sanitize_summary_value "$NOVA_SUMMARY_WORKSPACE")"
            NOVA_SUMMARY_DESTINATION="$(sanitize_summary_value "$NOVA_SUMMARY_DESTINATION")"
            NOVA_SUMMARY_RESULT="$(sanitize_summary_value "$NOVA_SUMMARY_RESULT")"

            printf "| %s | %s | %s | %s |\\n" "$NOVA_SUMMARY_WORK" "$NOVA_SUMMARY_WORKSPACE" "$NOVA_SUMMARY_DESTINATION" "$NOVA_SUMMARY_RESULT"

            NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_1_WORK_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORK" ]]; then
              NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_1_WORK"
            fi

            NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_1_WORKSPACE_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORKSPACE" ]]; then
              NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_1_WORKSPACE"
            fi

            NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_1_DESTINATION_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_DESTINATION" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_1_DESTINATION"
            fi

            NOVA_SUMMARY_DETAIL="$NOVA_SUMMARY_ROW_1_DETAIL_OUTPUT"
            if [[ -n "$NOVA_SUMMARY_DETAIL" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_DESTINATION · $NOVA_SUMMARY_DETAIL"
            fi

            NOVA_SUMMARY_RESULT="$NOVA_SUMMARY_ROW_1_RESULT"
            if [[ "$NOVA_SUMMARY_ROW_1_PUBLISH" == "true" && "$NOVA_SUMMARY_PUBLISH" != "true" ]]; then
              NOVA_SUMMARY_RESULT="dry run ($NOVA_SUMMARY_RESULT)"
            fi

            NOVA_SUMMARY_WORK="$(sanitize_summary_value "$NOVA_SUMMARY_WORK")"
            NOVA_SUMMARY_WORKSPACE="$(sanitize_summary_value "$NOVA_SUMMARY_WORKSPACE")"
            NOVA_SUMMARY_DESTINATION="$(sanitize_summary_value "$NOVA_SUMMARY_DESTINATION")"
            NOVA_SUMMARY_RESULT="$(sanitize_summary_value "$NOVA_SUMMARY_RESULT")"

            printf "| %s | %s | %s | %s |\\n" "$NOVA_SUMMARY_WORK" "$NOVA_SUMMARY_WORKSPACE" "$NOVA_SUMMARY_DESTINATION" "$NOVA_SUMMARY_RESULT"

            NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_2_WORK_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORK" ]]; then
              NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_2_WORK"
            fi

            NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_2_WORKSPACE_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORKSPACE" ]]; then
              NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_2_WORKSPACE"
            fi

            NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_2_DESTINATION_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_DESTINATION" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_2_DESTINATION"
            fi

            NOVA_SUMMARY_DETAIL="$NOVA_SUMMARY_ROW_2_DETAIL_OUTPUT"
            if [[ -n "$NOVA_SUMMARY_DETAIL" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_DESTINATION · $NOVA_SUMMARY_DETAIL"
            fi

            NOVA_SUMMARY_RESULT="$NOVA_SUMMARY_ROW_2_RESULT"
            if [[ "$NOVA_SUMMARY_ROW_2_PUBLISH" == "true" && "$NOVA_SUMMARY_PUBLISH" != "true" ]]; then
              NOVA_SUMMARY_RESULT="dry run ($NOVA_SUMMARY_RESULT)"
            fi

            NOVA_SUMMARY_WORK="$(sanitize_summary_value "$NOVA_SUMMARY_WORK")"
            NOVA_SUMMARY_WORKSPACE="$(sanitize_summary_value "$NOVA_SUMMARY_WORKSPACE")"
            NOVA_SUMMARY_DESTINATION="$(sanitize_summary_value "$NOVA_SUMMARY_DESTINATION")"
            NOVA_SUMMARY_RESULT="$(sanitize_summary_value "$NOVA_SUMMARY_RESULT")"

            printf "| %s | %s | %s | %s |\\n" "$NOVA_SUMMARY_WORK" "$NOVA_SUMMARY_WORKSPACE" "$NOVA_SUMMARY_DESTINATION" "$NOVA_SUMMARY_RESULT"

            NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_3_WORK_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORK" ]]; then
              NOVA_SUMMARY_WORK="$NOVA_SUMMARY_ROW_3_WORK"
            fi

            NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_3_WORKSPACE_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_WORKSPACE" ]]; then
              NOVA_SUMMARY_WORKSPACE="$NOVA_SUMMARY_ROW_3_WORKSPACE"
            fi

            NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_3_DESTINATION_OUTPUT"
            if [[ -z "$NOVA_SUMMARY_DESTINATION" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_ROW_3_DESTINATION"
            fi

            NOVA_SUMMARY_DETAIL="$NOVA_SUMMARY_ROW_3_DETAIL_OUTPUT"
            if [[ -n "$NOVA_SUMMARY_DETAIL" ]]; then
              NOVA_SUMMARY_DESTINATION="$NOVA_SUMMARY_DESTINATION · $NOVA_SUMMARY_DETAIL"
            fi

            NOVA_SUMMARY_RESULT="$NOVA_SUMMARY_ROW_3_RESULT"
            if [[ "$NOVA_SUMMARY_ROW_3_PUBLISH" == "true" && "$NOVA_SUMMARY_PUBLISH" != "true" ]]; then
              NOVA_SUMMARY_RESULT="dry run ($NOVA_SUMMARY_RESULT)"
            fi

            NOVA_SUMMARY_WORK="$(sanitize_summary_value "$NOVA_SUMMARY_WORK")"
            NOVA_SUMMARY_WORKSPACE="$(sanitize_summary_value "$NOVA_SUMMARY_WORKSPACE")"
            NOVA_SUMMARY_DESTINATION="$(sanitize_summary_value "$NOVA_SUMMARY_DESTINATION")"
            NOVA_SUMMARY_RESULT="$(sanitize_summary_value "$NOVA_SUMMARY_RESULT")"

            printf "| %s | %s | %s | %s |\\n" "$NOVA_SUMMARY_WORK" "$NOVA_SUMMARY_WORKSPACE" "$NOVA_SUMMARY_DESTINATION" "$NOVA_SUMMARY_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
